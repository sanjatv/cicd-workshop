name: CI
on: 
    push: 
    pull_request:

jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Hent koden
              uses: actions/checkout@v7
            
            - name: Sett opp Node
              uses: actions/setup-node@v7.1.0
              with:
                node-version: 24
                cache: npm
            
            - name: Insaller avhengigheter
              run: npm ci

            - name: Kjør tester
              run: npm test
            
            - name: Bygg
              env:
                VITE_APP_GREETING: ${{ vars.APP_GREETING }}
              run: npm run build
            
            - name: Last opp GitHub Pages artifact
              uses: actions/upload-pages-artifact@v5.0.0
              with:
                path: dist
    
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy GitHub Pages site
              id: deployment
              uses: actions/deploy-pages@v5.0.1
        permissions:
            pages: write
            id-token: write
        
