name: CI
on: 
    push: 
    pull_request:

jobs: 
    build:
    runs-on: ubuntu-latest
    steps:
        - name: Hent koden
          uses: actions/checkout@v7
        
        - name: Sett opp Node
          uses: actions/setup-node@v7.1.0
          with:
            node-version: 24
            cache: npm
        
        - name: Insaller avhengigheter
          run: npm ci

        - name: Kjør tester
          run: npm test